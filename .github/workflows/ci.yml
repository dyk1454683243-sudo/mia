name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

# A new push to a PR cancels the run still going for the old head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      # worker-configuration.d.ts is generated and gitignored, so a fresh
      # clone has none and tsc fails with TS2688 without this.
      - name: Generate worker types
        run: npm run types

      - run: npm run typecheck

      - run: npm test

      - name: Build the client
        run: npm run build
